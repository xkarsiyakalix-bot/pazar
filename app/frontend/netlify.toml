# Netlify Configuration for React App
[build]
  command = "CI= npm run build"
  publish = "build"
  base = ""

# Redirect all requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables (add these in Netlify dashboard)
# REACT_APP_API_URL = your backend URL

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Edge Functions for Dynamic Open Graph Tags
[[edge_functions]]
  path = "/*"
  function = "og-tags"

# Edge Function for AI Description Generation
[[edge_functions]]
  path = "/api/generate-description"
  function = "generate-description"
